name: Python checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-311:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install dependencies and check
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m compileall -q .
          python -c "import main, pipeline, settings; print('Python 3.11 import check passed')"

  python-313:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install dependencies and check
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m compileall -q .
          python -c "import main, pipeline, settings; print('Python 3.13 import check passed')"
